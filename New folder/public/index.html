<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mail Verification Console</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="card">
        <h1>Mail Verification API</h1>
        <p>
          Public Google Sheet se email column read karke syntax, MX, disposable aur Gmail SMTP checks run karega.
        </p>

        <form id="verify-form">
          <label>
            Google Sheet URL
            <input id="sheetUrl" name="sheetUrl" type="url" required placeholder="https://docs.google.com/spreadsheets/d/..." />
          </label>

          <div class="row-2">
            <label>
              Email Header
              <input id="emailHeader" name="emailHeader" value="email" required />
            </label>

            <label>
              Max Rows
              <input id="maxRows" name="maxRows" type="number" min="1" max="1000" value="100" required />
            </label>
          </div>

          <label>
            API Key
            <input id="apiKey" name="apiKey" value="local-dev-only-key" required />
          </label>

          <button type="submit">Verify Sheet</button>
        </form>
      </section>

      <section class="card">
        <div id="summary" class="summary muted">No verification run yet.</div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Row</th>
                <th>Email</th>
                <th>Status</th>
                <th>Reason</th>
              </tr>
            </thead>
            <tbody id="resultBody"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
