name: Deploy Backend to AWS Lambda

on:
  push:
    branches:
      - main
    paths:
      - 'Whatsapp/backend/**'
      - 'Whatsapp/server.js'
      - 'Whatsapp/send-whatsapp.js'
      - 'Whatsapp/package.json'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'

      - name: Install Dependencies & Create Zip
        run: |
          cd Whatsapp
          npm install --production
          zip -r backend-lambda.zip server.js send-whatsapp.js backend/lambda.js backend/package.json node_modules

      - name: Deploy to AWS Lambda
        uses: appleboy/lambda-action@v0.2.0
        with:
          aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws_region: ap-south-1
          function_name: talentwale-backend
          zip_file: Whatsapp/backend-lambda.zip
