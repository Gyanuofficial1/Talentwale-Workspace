# Backend - AWS Lambda Configuration

runtime = "nodejs18.x"
region = "us-east-1"

# Lambda function settings
memory_size = 256
timeout = 60

# Environment variables
[env]
NODE_ENV = "production"

# IAM Permissions needed:
# - AWSLambdaFullAccess
# - AmazonRDSFullAccess
# - AmazonSQSFullAccess
# - AmazonDynamoDBFullAccess

# API Gateway settings:
# - Resource: /api/*
# - Method: POST, GET
# - Authorizer: Optional (API Key or JWT)

# VPC settings (if using RDS):
# - VPC Security Group: Allow inbound 5432 (PostgreSQL)
# - Subnet: Private (for security)

# Layer dependencies (optional):
# - Layer ARN: nodejs-dependencies
