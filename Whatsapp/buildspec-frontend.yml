{
  "version": 0.2,
  "phases": {
    "install": {
      "runtime-versions": {
        "nodejs": "18"
      },
      "commands": [
        "echo 'Installing frontend dependencies...'",
        "cd frontend && npm install || true"
      ]
    },
    "pre_build": {
      "commands": [
        "echo 'Pre-build checks...'"
      ]
    },
    "build": {
      "commands": [
        "echo 'Copying frontend files to build folder...'",
        "cd frontend && mkdir -p build && cp -r src/* build/ && cp -r public/* build/ || true"
      ]
    }
  },
  "artifacts": {
    "files": [
      "frontend/build/**/*"
    ],
    "discard-paths": "no"
  }
}
